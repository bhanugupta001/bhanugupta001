<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-label="Measured results: 85 to 90 percent smaller pages, 59.9 percent lower cost per result, 75 percent faster in-house move, 99.9 percent uptime.">
  <defs>
    <linearGradient id="n" x1="0" x2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <style>
      .n{font:700 44px system-ui,-apple-system,Segoe UI,sans-serif;fill:url(#n)}
      .l{font:500 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#CBD5E1}
      .s{font:500 13px ui-monospace,Menlo,monospace;fill:#64748B}
    </style>
  </defs>
  <g>
    <rect x="0" y="0" width="282" height="190" rx="18" fill="#0F172A" stroke="#1E293B"/>
    <text class="n" x="24" y="78">85–90%</text>
    <text class="l" x="24" y="112">Smaller page weight</text>
    <text class="s" x="24" y="152">10 MB → 1 MB · AND Academy</text>
  </g>
  <g transform="translate(306 0)">
    <rect width="282" height="190" rx="18" fill="#0F172A" stroke="#1E293B"/>
    <text class="n" x="24" y="78">59.9%</text>
    <text class="l" x="24" y="112">Lower cost per result</text>
    <text class="s" x="24" y="152">Meta CAPI · AND Academy</text>
  </g>
  <g transform="translate(612 0)">
    <rect width="282" height="190" rx="18" fill="#0F172A" stroke="#1E293B"/>
    <text class="n" x="24" y="78">75%</text>
    <text class="l" x="24" y="112">Faster in-house move</text>
    <text class="s" x="24" y="152">1.5 vs 6 months · AND Academy</text>
  </g>
  <g transform="translate(918 0)">
    <rect width="282" height="190" rx="18" fill="#0F172A" stroke="#1E293B"/>
    <text class="n" x="24" y="78">99.9%</text>
    <text class="l" x="24" y="112">Uptime</text>
    <text class="s" x="24" y="152">Staging + prod · 1Dossier</text>
  </g>
</svg>
